name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Build do projeto
        run: npm run build
        env:
          CI: true

      - name: Gerar HTMLs estáticos para SEO
        run: node scripts/generate-static-html.mjs

      - name: Mostrar arquivos gerados
        run: |
          echo "--- Arquivos no diretório dist ---"
          ls -la dist/
          echo "--- HTMLs estáticos gerados ---"
          ls -la dist/*.html || true

      - name: Deploy FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: true
          dry-run: false
          log-level: verbose
